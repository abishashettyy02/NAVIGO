services:
  - type: web
    name: navigo-mangaluru
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: navigo-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: USERS_DB_PATH
        value: /app/data/users.db
